<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mickey Smart AI — Connect Deriv Account</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#020b16;color:#f8fbff;overflow:hidden}.top{height:64px;background:rgba(15,28,63,.95);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;padding:0 20px}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.logo{font-size:20px}.stage{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px)}.card{background:rgba(15,28,63,.95);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:50px 30px;text-align:center;width:min(500px,90%)}.grid{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(circle,rgba(255,255,255,.2) 1px,transparent 1px);background-size:50px 50px}.state-block{display:none;animation:fade .3s}.state-block.show{display:block}.spinner{width:50px;height:50px;border:3px solid rgba(0,198,255,.2);border-top-color:#00c6ff;border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}to{opacity:1}}h2,h3{margin:0;color:#fff}h2{font-size:24px;margin-bottom:10px}.sub{color:#bcdcff;font-size:14px;margin-top:10px}.xmark{font-size:48px;color:#ff6b9d;margin-bottom:15px}.check{font-size:48px;color:#22e08a;margin-bottom:15px}.btn{padding:14px 28px;border:none;border-radius:10px;background:linear-gradient(90deg,#00e0ff,#3a7bff);color:#fff;font-weight:700;cursor:pointer;margin-top:20px}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">⚙</div><div>Mickey Smart AI</div></div></header>
<main class="stage"><section class="card"><div class="grid"></div><div class="inner">

  <div class="state-block show" id="state-loading">
    <div class="spinner"></div>
    <h2>Connecting to Deriv</h2>
    <div class="sub">Exchanging your authorization code for an access token...</div>
  </div>

  <div class="state-block" id="state-error">
    <div class="xmark">✕</div>
    <h3>Could not connect</h3>
    <div class="sub" id="error-text">Deriv did not return an authorization code.</div>
    <button class="btn" onclick="location.href='/'">Back to Login</button>
  </div>

  <div class="state-block" id="state-success">
    <div class="check">✓</div>
    <h3>Connected!</h3>
    <div class="sub">Taking you to dashboard...</div>
  </div>

</div></section></main>
<script>
(function(){
  function show(id){
    ['state-loading','state-error','state-success'].forEach(function(s){
      document.getElementById(s).classList.toggle('show', s === id);
    });
  }

  function fail(message){
    console.error('❌ ' + message);
    document.getElementById('error-text').textContent = message;
    show('state-error');
  }

  var params = new URLSearchParams(window.location.search || '');

  if (params.get('error')) {
    var errorMsg = 'Deriv said: ' + (params.get('error_description') || params.get('error'));
    fail(errorMsg);
    return;
  }

  var code = params.get('code');
  var returnedState = params.get('state');

  if (!code) {
    fail('No authorization code returned by Deriv.');
    return;
  }

  var savedState = sessionStorage.getItem('deriv_oauth_state');
  var codeVerifier = sessionStorage.getItem('deriv_pkce_verifier');

  if (!codeVerifier) {
    fail('Missing security code. Please try connecting again.');
    return;
  }

  if (savedState && returnedState && savedState !== returnedState) {
    fail('Security check failed (state mismatch).');
    return;
  }

  fetch('/.netlify/functions/oauth-token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: code,
      code_verifier: codeVerifier,
      redirect_uri: window.location.origin + '/deriv/callback'
    })
  })
    .then(function(resp) {
      return resp.json().then(function(json) {
        return { ok: resp.ok, status: resp.status, json: json };
      });
    })
    .then(function(result){
      if (!result.ok) {
        var desc = (result.json && (result.json.error_description || result.json.message || result.json.error)) || 'Token exchange failed.';
        fail('Server error: ' + desc);
        return;
      }

      if (!result.json || !result.json.access_token) {
        fail('No access token received from server.');
        return;
      }

      try {
        sessionStorage.removeItem('deriv_pkce_verifier');
        sessionStorage.removeItem('deriv_oauth_state');
        sessionStorage.setItem('deriv_token', result.json.access_token);
        sessionStorage.setItem('deriv_token_type', result.json.token_type || 'Bearer');
        if (result.json.expires_in) {
          sessionStorage.setItem('deriv_token_expires', result.json.expires_in);
        }
      } catch (e) {
        console.error('Storage error:', e.message);
      }

      show('state-success');
      setTimeout(function(){
        window.location.replace('/smart-ai-bot-6-account-picker-fixed/app/index.html');
      }, 1200);
    })
    .catch(function(err){
      fail('Network error: ' + (err && err.message || err));
    });
})();
</script>
</body>
</html>
