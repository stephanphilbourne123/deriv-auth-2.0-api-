<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mickey Smart AI — Account Dashboard</title>
<style>
:root{--bg-1:#061629;--bg-2:#0a3d91;--bg-3:#6a11cb;--card:rgba(10, 18, 34, 0.72);--card-2:rgba(10, 22, 46, 0.68);--text:#f7fbff;--muted:rgba(235,245,255,0.78);--accent:#38bdf8;--good:#22c55e;--bad:#fb7185;--border:rgba(255,255,255,0.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 12% 18%, rgba(255,255,255,0.22), transparent 52%),radial-gradient(circle at 88% 7%, rgba(255,213,74,0.15), transparent 50%),linear-gradient(135deg, #061629, #0a3d91, #6a11cb);background-size:300% 300%;animation:bgShift 12s ease-in-out infinite;overflow-x:hidden}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg, rgba(6, 22, 41, 0.92), rgba(8, 32, 66, 0.92));backdrop-filter:blur(14px);border-right:1px solid var(--border);padding:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
.brand h1{font-size:16px;margin:0;font-weight:700}
.nav{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.nav button{text-align:left;padding:12px 14px;border-radius:10px;background:rgba(24,6,15,0.9);border:1px solid rgba(250,250,250,0.05);color:var(--text);cursor:pointer;font-weight:600;width:100%}
.nav button.active{outline:2px solid var(--accent);background:linear-gradient(180deg, rgba(36,7,17,0.95), rgba(45,9,22,0.95))}
main{padding:24px}
.panel{display:none}
.panel.active{display:block;animation:fade .18s ease-in}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--card),var(--card-2));backdrop-filter:blur(16px);border:1px solid rgba(250,250,250,0.08);border-radius:18px;padding:16px;margin-bottom:18px}
.balance-card{background:linear-gradient(135deg, rgba(34,197,94,0.12), rgba(56,189,248,0.08));border:1px solid rgba(56,189,248,0.3);border-radius:18px;padding:24px;margin-bottom:20px}
.balance-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.balance-info{display:flex;align-items:center;gap:12px}
.account-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg, rgba(56,189,248,0.3), rgba(34,197,94,0.2));display:flex;align-items:center;justify-content:center;font-size:24px}
.balance-meta h3{margin:0 0 4px 0;font-size:16px;font-weight:700}
.balance-meta p{margin:0;font-size:12px;color:var(--muted)}
.status-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);font-size:12px;font-weight:600;color:var(--good)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.balance-display{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.balance-item{background:rgba(0,0,0,0.3);border:1px solid rgba(250,250,250,0.08);border-radius:12px;padding:12px}
.balance-item label{font-size:11px;color:var(--muted);margin:0 0 4px 0;font-weight:500}
.balance-item .value{font-size:18px;font-weight:700;color:var(--good);margin:0}
.balance-actions{display:flex;gap:10px}
.btn-primary{flex:1;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg, var(--accent), #0ea5e9);color:var(--text);font-weight:600;cursor:pointer;font-size:14px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(56,189,248,0.3)}
.btn-danger{padding:12px 16px;border:1px solid rgba(251,113,133,0.4);background:rgba(251,113,133,0.1);color:var(--bad);font-weight:600;cursor:pointer;border-radius:10px;font-size:14px}
.btn-danger:hover{background:rgba(251,113,133,0.2)}
h2{margin:0 0 12px 0;font-size:18px;font-weight:700}
p{margin:0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <h1>Mickey AI</h1>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-panel="balance">💰 Balance</button>
      <button class="nav-btn" data-panel="trading">📊 Trading</button>
      <button class="nav-btn" data-panel="settings">⚙️ Settings</button>
    </nav>
  </aside>

  <main>
    <div id="balance" class="panel active">
      <div class="balance-card">
        <div class="balance-header">
          <div class="balance-info">
            <div class="account-avatar" id="accountAvatar">💰</div>
            <div class="balance-meta">
              <h3 id="accountLoginId">Account ID</h3>
              <p id="accountType">Loading account...</p>
            </div>
          </div>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span id="connectionStatus">Connected</span>
          </div>
        </div>
        <div class="balance-display">
          <div class="balance-item">
            <label>Account Balance</label>
            <p class="value" id="accountBalance">USD 0.00</p>
          </div>
          <div class="balance-item">
            <label>P/L (Today)</label>
            <p class="value" id="accountPL">USD 0.00</p>
          </div>
        </div>
        <div class="balance-actions">
          <button class="btn-primary" onclick="redirectToSelector()">Switch Account</button>
          <button class="btn-danger" onclick="disconnectAccount()">Disconnect</button>
        </div>
      </div>

      <div class="card">
        <h2>📈 Account Overview</h2>
        <p>Your trading activity and statistics will appear here.</p>
      </div>
    </div>

    <div id="trading" class="panel">
      <div class="card">
        <h2>📊 Trading History</h2>
        <p>View your trading history and performance metrics.</p>
      </div>
    </div>

    <div id="settings" class="panel">
      <div class="card">
        <h2>⚙️ Settings</h2>
        <p>Manage your account preferences and security settings.</p>
      </div>
    </div>
  </main>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script>
function loadAccountData() {
  try {
    const accountData = JSON.parse(sessionStorage.getItem('deriv_selected_account') || '{}');
    if (!accountData || !accountData.account_id) {
      console.warn('⚠️ No account data - using demo account');
      // Set demo account if none exists
      sessionStorage.setItem('deriv_selected_account', JSON.stringify({
        account_id: 'DEMO123456789',
        account_type: 'demo',
        balance: 10000,
        currency: 'USD'
      }));
      loadAccountData(); // Recurse to load the demo data
      return;
    }
    const isDemo = accountData.account_type === 'demo';
    const icon = isDemo ? '🧪' : '💰';
    const typeLabel = isDemo ? 'Demo Account' : 'Live Account';
    const balance = accountData.balance !== undefined ? parseFloat(accountData.balance).toFixed(2) : '0.00';
    const currency = accountData.currency || 'USD';
    document.getElementById('accountAvatar').textContent = icon;
    document.getElementById('accountLoginId').textContent = accountData.account_id;
    document.getElementById('accountType').textContent = `${typeLabel} • ${currency}`;
    document.getElementById('accountBalance').textContent = `${currency} ${balance}`;
    console.log('✅ Account loaded:', accountData);
  } catch (error) {
    console.error('❌ Error loading account:', error);
  }
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const panelId = this.dataset.panel;
    document.getElementById(panelId).classList.add('active');
  });
});

function redirectToSelector() {
  console.log('🔄 Redirecting to account selector...');
  window.location.replace('/app/selector.html');
}

function disconnectAccount() {
  if (!confirm('Disconnect your account?')) return;
  ['deriv_token', 'deriv_selected_account', 'deriv_connected', 'selected_account', 'deriv_user_id', 'deriv_token_type', 'deriv_token_expires'].forEach(key => {
    sessionStorage.removeItem(key);
    localStorage.removeItem(key);
  });
  console.log('✅ Account disconnected');
  window.location.replace('/');
}

window.addEventListener('load', function() {
  console.log('📄 Dashboard loaded');
  loadAccountData();
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const identity = window.netlifyIdentity;

  if (!identity) {
    console.log('Netlify Identity not loaded - loading dashboard anyway');
    return;
  }

  identity.on('login', function (user) {
    if (user) {
      console.log('✅ User logged in:', user);
      identity.close();
    }
  });

  identity.init();
});
</script>

</body>
</html>
