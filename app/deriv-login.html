<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deriv OAuth 2.0 Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #00c6ff, #0072ff, #6a11cb);
      background-size: 260% 260%;
      animation: bgShift 18s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .login-container {
      width: min(500px, 100%);
      background: rgba(15, 28, 63, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.8);
    }
    .login-icon { font-size: 48px; margin-bottom: 20px; }
    .login-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
    .login-sub { font-size: 14px; color: #bcdcff; margin-bottom: 40px; }
    .oauth-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(90deg, #00e0ff, #3a7bff);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .oauth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 224, 255, 0.4);
    }
    .oauth-btn:active { transform: translateY(0); }
    .oauth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .oauth-icon { font-size: 20px; }
    .error {
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #ff6b9d;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .success {
      background: rgba(34, 224, 138, 0.1);
      border: 1px solid rgba(34, 224, 138, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #22e08a;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 198, 255, 0.2);
      border-top-color: #00c6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-text {
      font-size: 12px;
      color: #8ab4e8;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-icon">🚀</div>
    <div class="login-title">Login with Deriv</div>
    <div class="login-sub">Connect your Deriv account to start trading</div>
    
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
    
    <button id="derivLoginBtn" class="oauth-btn">
      <span class="oauth-icon">📊</span>
      <span id="btnText">Sign In with Deriv</span>
    </button>
    
    <div class="info-text">
      ℹ️ You'll be redirected to Deriv to securely authorize access
    </div>
  </div>

  <script>
    // Deriv OAuth 2.0 + PKCE Configuration
    const DERIV_CLIENT_ID = '33wk6T0W5ZsXYqjz3eY90';
    const DERIV_OAUTH_URL = 'https://auth.deriv.com/oauth2/auth';
    const REDIRECT_URI = window.location.origin + '/deriv/callback';
    const SCOPE = 'read write trade';

    // PKCE helper: base64url encode a Uint8Array
    function base64urlEncode(buffer) {
      return btoa(String.fromCharCode(...buffer))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=/g, '');
    }

    // Generate a cryptographically random code_verifier (64 bytes → 86-char base64url string)
    function generateCodeVerifier() {
      const array = new Uint8Array(64);
      crypto.getRandomValues(array);
      return base64urlEncode(array);
    }

    // Derive code_challenge = BASE64URL(SHA-256(code_verifier))
    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return base64urlEncode(new Uint8Array(digest));
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      const btn = document.getElementById('derivLoginBtn');
      btn.disabled = false;
      document.getElementById('btnText').textContent = 'Sign In with Deriv';
      console.error('❌', message);
    }

    async function startOAuthFlow() {
      const btn = document.getElementById('derivLoginBtn');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      btnText.textContent = 'Redirecting...';

      console.log('🚀 Starting Deriv OAuth 2.0 + PKCE flow...');
      console.log('Client ID:', DERIV_CLIENT_ID);
      console.log('Redirect URI:', REDIRECT_URI);

      try {
        // 1. Generate PKCE pair
        const codeVerifier = generateCodeVerifier();
        const codeChallenge = await generateCodeChallenge(codeVerifier);

        // 2. Generate state for CSRF protection
        const state = base64urlEncode(crypto.getRandomValues(new Uint8Array(16)));

        // 3. Persist PKCE verifier and state for the callback page
        sessionStorage.setItem('deriv_pkce_verifier', codeVerifier);
        sessionStorage.setItem('deriv_oauth_state', state);

        console.log('PKCE code_challenge ready');
        console.log('State:', state);

        // 4. Build the authorization URL
        const params = new URLSearchParams({
          client_id: DERIV_CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          response_type: 'code',
          scope: SCOPE,
          state: state,
          code_challenge: codeChallenge,
          code_challenge_method: 'S256'
        });

        const authUrl = DERIV_OAUTH_URL + '?' + params.toString();
        console.log('✅ Authorization URL built. Redirecting to Deriv...');

        // 5. Redirect user to Deriv's authorization page
        window.location.href = authUrl;
      } catch (err) {
        console.error('❌ Failed to start OAuth flow:', err);
        showError('Failed to start login: ' + (err.message || err));
      }
    }

    document.getElementById('derivLoginBtn').addEventListener('click', startOAuthFlow);

    console.log('🔧 Deriv OAuth + PKCE Login Page Loaded');
    console.log('Client ID:', DERIV_CLIENT_ID);
  </script>
</body>
</html>
