<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mickey Smart AI - Dashboard</title><style>:root{--bg-1:#061629;--bg-2:#0a3d91;--bg-3:#6a11cb;--card:rgba(10,18,34,0.72);--card-2:rgba(10,22,46,0.68);--text:#f7fbff;--muted:rgba(235,245,255,0.78);--accent:#38bdf8;--good:#22c55e;--bad:#fb7185;--border:rgba(120,200,255,0.22)}*{box-sizing:border-box}html,body{height:100%;margin:0;color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,0.22),transparent 52%),radial-gradient(circle at 88% 78%,rgba(255,255,255,0.16),transparent 55%),radial-gradient(circle at 30% 85%,rgba(56,189,248,0.35),transparent 60%),radial-gradient(circle at 85% 25%,rgba(106,17,203,0.28),transparent 62%),linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3));overflow:auto}.balance-card{background:linear-gradient(180deg,rgba(34,197,94,.15),rgba(56,189,248,.12));border:1px solid rgba(34,197,94,.35);border-radius:18px;padding:20px;margin:24px;box-shadow:0 0 28px rgba(34,197,94,.25),0 12px 24px rgba(0,0,0,.3);backdrop-filter:blur(16px);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.balance-card-left{display:flex;align-items:center;gap:16px}.balance-card-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,rgba(34,197,94,.3),rgba(56,189,248,.3));border:1px solid rgba(34,197,94,.5);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 18px rgba(34,197,94,.2)}.balance-card-info{display:flex;flex-direction:column;gap:6px}.balance-card-label{font-size:12px;color:rgba(235,245,255,.6);text-transform:uppercase;letter-spacing:1px;font-weight:700}.balance-card-account{font-size:16px;font-weight:700;color:var(--text)}.balance-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.balance-card-amount{font-size:32px;font-weight:1000;color:#22e08a;line-height:1;text-shadow:0 0 18px rgba(34,224,138,.3)}.balance-card-time{font-size:11px;color:rgba(235,245,255,.5)}@media(max-width:768px){.balance-card{grid-template-columns:1fr;gap:12px}.balance-card-right{align-items:flex-start}.balance-card-amount{font-size:24px}}</style></head><body><div class="balance-card" id="balanceCard"><div class="balance-card-left"><div class="balance-card-icon">💰</div><div class="balance-card-info"><div class="balance-card-label">Account Balance</div><div class="balance-card-account" id="balanceAccount">Loading...</div></div></div><div class="balance-card-right"><div class="balance-card-amount" id="balanceAmount">--</div><div class="balance-card-time" id="balanceTime">Fetching...</div></div></div><script>document.addEventListener('DOMContentLoaded',function(){initializeBalance();setInterval(initializeBalance,30000)});async function initializeBalance(){try{const selectedAccount=JSON.parse(sessionStorage.getItem('selected_account')||'{}');const token=sessionStorage.getItem('deriv_token');if(!token||!selectedAccount.loginid){document.getElementById('balanceAccount').textContent='Not connected';document.getElementById('balanceAmount').textContent='--';return}document.getElementById('balanceAccount').textContent=selectedAccount.loginid;const response=await fetch('https://api.deriv.com/api/v3/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({authorize:token,balance:1})});const data=await response.json();if(data.balance){const amount=data.balance.balance;const currency=data.balance.currency;document.getElementById('balanceAmount').textContent=currency+' '+amount.toFixed(2);document.getElementById('balanceTime').textContent='Just now'}}catch(error){console.error('Balance error:',error)}}document.addEventListener('visibilitychange',function(){if(!document.hidden){initializeBalance()}});</script></body></html>
