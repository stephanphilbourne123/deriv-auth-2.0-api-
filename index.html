<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Mickey Smart AI — Login</title><link rel="icon" href="favicon.png"><style>:root{--bg1:#00c6ff;--bg2:#6a11cb;--card:#0f1c3f;--text:#ffffff;--muted:#bcdcff;--accent1:#00e0ff;--accent2:#3a7bff;}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);overflow-x:hidden;background:radial-gradient(circle at top right,rgba(255,255,255,.12),transparent 55%),radial-gradient(circle at bottom left,rgba(0,0,0,.25),transparent 60%),linear-gradient(135deg,#00c6ff,#0072ff,#6a11cb);background-size:260% 260%;animation:bgShift 18s ease-in-out infinite;}@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}.float-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}.float-emoji{position:absolute;opacity:.55;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:floatDrift 16s ease-in-out infinite;user-select:none;}@keyframes floatDrift{0%{transform:translate3d(0,18px,0) rotate(0deg)}50%{transform:translate3d(18px,-18px,0) rotate(10deg)}100%{transform:translate3d(0,18px,0) rotate(0deg)}}.shell{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}.wrap{width:min(420px,100%);background:linear-gradient(180deg,rgba(20,18,40,.96),rgba(10,10,28,.98));border-radius:22px;border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 55px rgba(0,0,0,.8);padding:32px;text-align:center;}.title{font-size:28px;font-weight:800;margin-bottom:12px;}.subtitle{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6;}.btn{display:inline-block;padding:12px 28px;border-radius:999px;border:none;font-weight:600;font-size:14px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#3b0b13;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:0.2s ease;}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.6);}</style></head><body><div class="float-wrap" aria-hidden="true"><div class="float-emoji" style="left:8%; top:10%; font-size:42px; animation-delay:-2s;">🌊</div><div class="float-emoji" style="left:70%; top:20%; font-size:30px; animation-delay:-5s;">🤖</div><div class="float-emoji" style="left:15%; top:70%; font-size:22px; animation-delay:-7s;">✨</div><div class="float-emoji" style="left:85%; top:75%; font-size:28px; animation-delay:-3s;">⚡</div></div><div class="shell"><div class="wrap"><div class="title">🤖 Mickey</div><p class="subtitle">Access your trading dashboard and manage your Deriv accounts.</p><button class="btn" onclick="window.location.href='/app'">Go to Dashboard →</button></div></div></body></html>
