<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mickey Smart AI — Dashboard</title>
<style>
:root {
  --bg-1: #061629;
  --bg-2: #0a3d91;
  --bg-3: #6a11cb;
  --card: rgba(10, 18, 34, 0.72);
  --card-2: rgba(10, 22, 46, 0.68);
  --text: #f7fbff;
  --muted: rgba(235, 245, 255, 0.78);
  --accent: #38bdf8;
  --good: #22c55e;
  --bad: #fb7185;
  --border: rgba(120, 200, 255, 0.22);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.22), transparent 52%),
    radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.16), transparent 55%),
    radial-gradient(circle at 30% 85%, rgba(56, 189, 248, 0.35), transparent 60%),
    radial-gradient(circle at 85% 25%, rgba(106, 17, 203, 0.28), transparent 62%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
}

.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

.sidebar {
  background: linear-gradient(180deg, rgba(6, 22, 41, 0.92), rgba(8, 32, 66, 0.92));
  backdrop-filter: blur(14px);
  border-right: 1px solid var(--border);
  padding: 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
}

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
.brand h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.3px; }

.card {
  background: linear-gradient(180deg, var(--card), var(--card-2));
  backdrop-filter: blur(16px);
  border: 1px solid rgba(250, 250, 250, 0.08);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 22px 45px rgba(0, 0, 0, 0.05);
}

main { padding: 24px; }

.deriv-card {
  background: linear-gradient(180deg, rgba(34, 197, 94, 0.15), rgba(56, 189, 248, 0.12));
  border: 1px solid rgba(34, 197, 94, 0.35);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 0 0 28px rgba(34, 197, 94, 0.25);
}

.deriv-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.deriv-icon { font-size: 28px; }
.deriv-title { font-size: 18px; font-weight: 700; }
.deriv-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; }
.deriv-item:last-child { border-bottom: none; }
.deriv-label { color: var(--muted); }
.deriv-value { font-weight: 700; color: #22e08a; }
.deriv-value.disconnected { color: #ff6b9d; }

.connected { color: #22e08a !important; }
.disconnected { color: #ff6b9d !important; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><h1>Mickey Smart AI</h1></div>
    
    <div class="card">
      <h3 style="margin: 0 0 12px; font-size: 14px;">🔗 Deriv Account</h3>
      <div style="display: grid; gap: 8px; font-size: 13px;">
        <div>
          <div style="color: var(--muted); font-size: 11px; margin-bottom: 2px;">Status</div>
          <div id="derivConnectionStatus" class="disconnected">Disconnected</div>
        </div>
        <div>
          <div style="color: var(--muted); font-size: 11px; margin-bottom: 2px;">Account</div>
          <div id="derivAccountId">Account: -</div>
        </div>
        <div>
          <div style="color: var(--muted); font-size: 11px; margin-bottom: 2px;">Balance</div>
          <div id="derivAccountBalance">Balance: -</div>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div class="deriv-card">
      <div class="deriv-header">
        <div class="deriv-icon">💰</div>
        <div class="deriv-title">Account Dashboard</div>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Status:</span>
        <span id="derivConnectionStatus2" class="deriv-value disconnected">Disconnected</span>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Account ID:</span>
        <span id="derivAccountId2" class="deriv-value">-</span>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Balance:</span>
        <span id="derivAccountBalance2" class="deriv-value">-</span>
      </div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const savedAccount = sessionStorage.getItem('deriv_selected_account');

  if (!savedAccount) {
    console.warn('⚠️ No selected account found');
    return;
  }

  try {
    const account = JSON.parse(savedAccount);
    console.log('✅ Account loaded:', account);

    const statusElements = document.querySelectorAll('[id="derivConnectionStatus"], [id="derivConnectionStatus2"]');
    const accountElements = document.querySelectorAll('[id="derivAccountId"], [id="derivAccountId2"]');
    const balanceElements = document.querySelectorAll('[id="derivAccountBalance"], [id="derivAccountBalance2"]');

    statusElements.forEach(el => {
      if (el) {
        const accountType = account.account_type === 'real' ? 'Live' : 'Demo';
        el.textContent = `Connected — ${accountType}`;
        el.classList.remove('disconnected');
        el.classList.add('connected');
      }
    });

    accountElements.forEach(el => {
      if (el) {
        el.textContent = account.account_id || 'Account unavailable';
      }
    });

    balanceElements.forEach(el => {
      if (el) {
        const currency = account.currency || 'USD';
        const balance = Number(account.balance || 0);
        el.textContent = `${currency} ${balance.toFixed(2)}`;
      }
    });
  } catch (error) {
    console.error('❌ Error loading account:', error);
  }
});
</script>
</body>
</html>
