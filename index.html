<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mickey Smart AI — Login</title>
  <link rel="icon" href="favicon.png">
  
  <style>
    :root{
      /* Ocean Breeze Mix */
      --bg1:#00c6ff;
      --bg2:#6a11cb;
      --card:#0f1c3f;
      --card-soft:#16265a;
      --text:#ffffff;
      --muted:#bcdcff;
      --accent1:#00e0ff;
      --accent2:#3a7bff;
      --danger:#ff4d6d;
      --border:rgba(255,255,255,.15);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      /* animated Ocean Breeze gradient */
      background:
        radial-gradient(circle at top right,rgba(255,255,255,.12),transparent 55%),
        radial-gradient(circle at bottom left,rgba(0,0,0,.25),transparent 60%),
        linear-gradient(135deg,#00c6ff,#0072ff,#6a11cb);
      background-size:260% 260%;
      animation:bgShift 18s ease-in-out infinite;
    }

    @keyframes bgShift{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    /* FLOATING EMOJIS (Ocean Breeze) */
    .float-wrap{
      position:fixed;
      inset:0;
      pointer-events:none;
    }
    .float{
      position:absolute;
      font-size:32px;
      opacity:0.15;
      animation:float 6s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-30px)}
    }

    /* LOGIN CARD */
    .login-wrap{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .login-card{
      width:100%;
      max-width:420px;
      background:rgba(15,28,63,0.95);
      border:1px solid var(--border);
      border-radius:20px;
      padding:40px 32px;
      box-shadow:0 24px 64px rgba(0,0,0,0.8);
      backdrop-filter:blur(10px);
    }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:28px;
    }
    .card-text h2{
      font-size:26px;
      font-weight:800;
      margin-bottom:8px;
    }
    .card-text p{
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
    }
    .card-icon{
      font-size:40px;
      flex-shrink:0;
    }

    .btn-row{
      display:flex;
      gap:12px;
      margin-bottom:16px;
    }
    .btn{
      flex:1;
      padding:12px 24px;
      border:none;
      border-radius:10px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      transition:all 0.2s ease;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      color:var(--text);
    }
    .btn.primary:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(0,224,255,0.3);
    }
    .btn.secondary{
      background:rgba(255,255,255,0.1);
      border:1px solid var(--border);
      color:var(--text);
    }
    .btn.secondary:hover{
      background:rgba(255,255,255,0.15);
    }
    .btn:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    .status-box{
      font-size:12px;
      color:var(--muted);
      text-align:center;
      background:rgba(255,255,255,.05);
      border-radius:8px;
      padding:12px;
      min-height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .error{
      background:rgba(255,77,109,0.15);
      border:1px solid rgba(255,77,109,0.3);
      color:#ff6b9d;
      border-radius:8px;
      padding:12px;
      margin-bottom:16px;
      font-size:12px;
    }

    .spinner{
      width:16px;
      height:16px;
      border:2px solid rgba(0,224,255,0.2);
      border-top:2px solid var(--accent1);
      border-radius:50%;
      animation:spin 1s linear infinite;
      display:inline-block;
      margin-right:8px;
    }
    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    @media(max-width:768px){
      .login-card{
        max-width:100%;
        padding:32px 24px;
      }
      .card-head{
        flex-direction:column;
      }
      .card-text h2{
        font-size:22px;
      }
    }
  </style>
</head>
<body>
  <div class="float-wrap" id="floats"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="card-head">
        <div class="card-text">
          <h2>Secure Login</h2>
          <p>Use your invite or create an account to access the dashboard</p>
        </div>
        <div class="card-icon">🔒</div>
      </div>

      <div id="errorBox" class="error" style="display:none"></div>

      <div class="btn-row">
        <button id="loginBtn" class="btn primary">Sign in / Sign up</button>
        <button id="logoutBtn" class="btn secondary" style="display:none">Log out</button>
      </div>

      <div class="status-box">
        <span id="status">Checking authentication…</span>
      </div>
    </div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Add floating emojis
    const emojis = ['🚀', '💡', '⚡', '🎯', '✨'];
    const floatWrap = document.getElementById('floats');
    for (let i = 0; i < 5; i++) {
      const float = document.createElement('div');
      float.className = 'float';
      float.textContent = emojis[i];
      float.style.left = Math.random() * 100 + '%';
      float.style.top = Math.random() * 100 + '%';
      float.style.animationDelay = Math.random() * 2 + 's';
      floatWrap.appendChild(float);
    }

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusBox = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.style.display = 'none';
    }

    function userHasAccess(user) {
      return user && (user.role === 'admin' || user.role === 'member' || !user.role);
    }

    function goToDashboard(message) {
      statusBox.innerHTML = `<div class="spinner"></div>${message}`;
      loginBtn.disabled = true;
      logoutBtn.disabled = true;
      setTimeout(() => {
        window.location.replace('/app/');
      }, 800);
    }

    loginBtn.onclick = function() {
      if (!window.netlifyIdentity) {
        showError('Authentication service not ready');
        return;
      }
      const user = typeof netlifyIdentity.currentUser === 'function'
        ? netlifyIdentity.currentUser()
        : null;

      if (user) {
        if (userHasAccess(user)) {
          goToDashboard('Redirecting to dashboard...');
        } else {
          showError('Your account is pending access approval.');
          loginBtn.textContent = 'Awaiting Access';
          loginBtn.disabled = true;
          logoutBtn.style.display = 'inline-flex';
        }
      } else {
        netlifyIdentity.open('login');
      }
    };

    logoutBtn.onclick = function() {
      netlifyIdentity.logout();
    };

    document.addEventListener('DOMContentLoaded', function() {
      if (!window.netlifyIdentity) {
        showError('Authentication service failed to load');
        return;
      }

      netlifyIdentity.on('init', (user) => {
        if (user) {
          statusBox.textContent = '✓ Signed in';
          loginBtn.textContent = 'Go to Dashboard';
          logoutBtn.style.display = 'inline-flex';
          clearError();
        } else {
          statusBox.textContent = 'Ready to sign in';
          loginBtn.textContent = 'Sign in / Sign up';
          logoutBtn.style.display = 'none';
          clearError();
        }
      });

      netlifyIdentity.on('login', (user) => {
        if (user && userHasAccess(user)) {
          goToDashboard('Signed in — redirecting...');
        } else if (user) {
          showError('Your account is pending access approval.');
          loginBtn.textContent = 'Awaiting Access';
          loginBtn.disabled = true;
          logoutBtn.style.display = 'inline-flex';
        }
      });

      netlifyIdentity.on('logout', () => {
        window.location.replace('/');
      });

      netlifyIdentity.on('error', (err) => {
        showError('Login error: ' + (err?.message || 'Unknown error'));
        statusBox.textContent = 'Error - please try again';
        loginBtn.disabled = false;
      });

      netlifyIdentity.init();
    });
  </script>
</body>
</html>
