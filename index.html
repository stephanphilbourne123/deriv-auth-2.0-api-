<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mickey Smart AI — Login</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #00c6ff, #0072ff, #6a11cb);
      background-size: 260% 260%;
      animation: bgShift 18s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .login-container {
      width: min(500px, 100%);
      background: rgba(15, 28, 63, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.8);
    }
    .login-icon { font-size: 48px; margin-bottom: 20px; }
    .login-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
    .login-sub { font-size: 14px; color: #bcdcff; margin-bottom: 40px; }
    .oauth-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .oauth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 114, 255, 0.4); }
    .oauth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .oauth-icon { font-size: 20px; }
    .error {
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #ff6b9d;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .success {
      background: rgba(34, 224, 138, 0.1);
      border: 1px solid rgba(34, 224, 138, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #22e08a;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .info-text {
      font-size: 12px;
      color: #8ab4e8;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .redirecting { display: none; }
    .redirecting.active {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #4ade80;
      font-weight: 600;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 198, 255, 0.2);
      border-top-color: #00c6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-icon">🎯</div>
    <div class="login-title">Mickey Smart AI</div>
    <div class="login-sub">Connect your Deriv account to get started</div>
    
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
    
    <button id="derivLoginBtn" class="oauth-btn">
      <span class="oauth-icon">📊</span>
      <span id="btnText">Sign In with Deriv</span>
    </button>
    
    <div class="redirecting" id="redirecting">
      <div class="spinner"></div>
      <span>Redirecting to account selector...</span>
    </div>
    
    <div class="info-text">
      ℹ️ You'll be redirected to Deriv to securely authorize access
    </div>
  </div>

  <script>
    // Deriv OAuth Configuration
    const DERIV_CLIENT_ID = '33wk6T0W5ZsXYqjz3eY90';
    const DERIV_OAUTH_URL = 'https://oauth.deriv.com/oauth2/authorize';
    const REDIRECT_URI = window.location.origin + '/.netlify/functions/callback';
    const SCOPE = 'read write';

    function startOAuthFlow() {
      const btn = document.getElementById('derivLoginBtn');
      const btnText = document.getElementById('btnText');
      
      btn.disabled = true;
      btnText.textContent = 'Redirecting...';

      console.log('🚀 Starting OAuth flow...');
      console.log('Client ID:', DERIV_CLIENT_ID);
      console.log('Redirect URI:', REDIRECT_URI);

      // Generate state for CSRF protection
      const state = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
      sessionStorage.setItem('oauth_state', state);
      console.log('State:', state);

      // Build OAuth URL
      const params = new URLSearchParams({
        client_id: DERIV_CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: 'code',
        scope: SCOPE,
        state: state
      });

      const authUrl = `${DERIV_OAUTH_URL}?${params.toString()}`;
      console.log('✅ OAuth URL ready. Redirecting...');
      
      // Redirect to Deriv OAuth
      window.location.href = authUrl;
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      console.error('❌', message);
    }

    function showSuccess(message) {
      const successMsg = document.getElementById('successMsg');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      console.log('✅', message);
    }

    // Check if user already has a valid token
    function checkForExistingToken() {
      const token = sessionStorage.getItem('deriv_token');
      console.log('🔑 Checking for existing token:', !!token);
      
      if (token) {
        console.log('✅ Valid token found in sessionStorage');
        showSuccess('✅ Already logged in! Redirecting to account selector...');
        document.getElementById('redirecting').classList.add('active');
        document.getElementById('derivLoginBtn').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        
        setTimeout(() => {
          console.log('🚀 Redirecting to account selector...');
          window.location.href = '/app/selector.html';
        }, 1500);
        return true;
      }
      
      // No token found, show login button
      console.log('❌ No token found - showing login button');
      return false;
    }

    // Event listeners
    document.getElementById('derivLoginBtn').addEventListener('click', startOAuthFlow);

    // Check on page load
    window.addEventListener('load', checkForExistingToken);

    console.log('🔧 Homepage Loaded');
  </script>
</body>
</html>
