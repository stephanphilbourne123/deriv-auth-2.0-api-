<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mickey Smart AI — Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, system-ui, Segoe UI, Roboto, sans-serif;
    color: #ffffff;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.22), transparent 52%),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.16), transparent 55%),
      radial-gradient(circle at 30% 85%, rgba(56,189,248,0.35), transparent 60%),
      radial-gradient(circle at 85% 25%, rgba(106,17,203,0.28), transparent 62%),
      linear-gradient(135deg, #061629, #0a3d91, #6a11cb);
    background-size: 260% 260%;
    animation: bgShift 18s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    width: min(480px, 100%);
    background: rgba(10, 18, 34, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 50px 36px;
    text-align: center;
    box-shadow: 0 24px 56px rgba(0, 0, 0, 0.7);
  }
  .logo { font-size: 52px; margin-bottom: 18px; }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  .sub { font-size: 14px; color: #bcdcff; margin-bottom: 40px; line-height: 1.6; }
  .signin-btn {
    display: flex;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00e0ff, #3a7bff);
    color: #ffffff;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    text-decoration: none;
  }
  .signin-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0, 198, 255, 0.4);
  }
  .signin-btn:active { transform: translateY(0); }
  .info {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(188, 220, 255, 0.7);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🚀</div>
  <h1>Mickey Smart AI</h1>
  <p class="sub">Connect your Deriv account to access your trading dashboard and manage your portfolio.</p>
  <a class="signin-btn" href="/app/deriv-login.html">
    <span>📊</span>
    <span>Sign In</span>
  </a>
  <div class="info">Securely powered by Deriv OAuth 2.0</div>
</div>
<script>
  // If already logged in, go straight to the dashboard
  (function () {
    var token = sessionStorage.getItem('deriv_token');
    var account = sessionStorage.getItem('deriv_selected_account');
    if (token && account) {
      window.location.replace('/dashboard.html');
    }
  })();
</script>
</body>
</html>
