<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mickey Smart AI — Dashboard</title>
<style>
:root {
  --bg-1: #061629;
  --bg-2: #0a3d91;
  --bg-3: #6a11cb;
  --card: rgba(10, 18, 34, 0.72);
  --card-2: rgba(10, 22, 46, 0.68);
  --text: #f7fbff;
  --muted: rgba(235, 245, 255, 0.78);
  --accent: #38bdf8;
  --good: #22c55e;
  --bad: #fb7185;
  --border: rgba(120, 200, 255, 0.22);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.22), transparent 52%),
    radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.16), transparent 55%),
    radial-gradient(circle at 30% 85%, rgba(56, 189, 248, 0.35), transparent 60%),
    radial-gradient(circle at 85% 25%, rgba(106, 17, 203, 0.28), transparent 62%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
}

.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

.sidebar {
  background: linear-gradient(180deg, rgba(6, 22, 41, 0.92), rgba(8, 32, 66, 0.92));
  backdrop-filter: blur(14px);
  border-right: 1px solid var(--border);
  padding: 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon { font-size: 28px; }

.sidebar-section {
  margin-bottom: 25px;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.sidebar-item {
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.2s ease;
  background: transparent;
  color: var(--muted);
}

.sidebar-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: var(--accent);
}

.sidebar-item.active {
  background: rgba(56, 189, 248, 0.2);
  color: var(--accent);
}

.sidebar-label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
}

.sidebar-value {
  display: block;
  font-weight: 600;
  color: var(--text);
}

main {
  display: flex;
  flex-direction: column;
  padding: 30px;
  gap: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  backdrop-filter: blur(10px);
}

.card h2 {
  margin-top: 0;
  margin-bottom: 16px;
  font-size: 18px;
}

.card p {
  margin: 0;
  color: var(--muted);
}

.deriv-section {
  background: var(--card-2);
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 14px;
  padding: 20px;
  backdrop-filter: blur(10px);
}

.deriv-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.deriv-icon { font-size: 24px; }

.deriv-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.deriv-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(120, 200, 255, 0.1);
}

.deriv-item:last-child { border-bottom: none; }

.deriv-label {
  font-size: 12px;
  color: var(--muted);
}

.deriv-value {
  font-weight: 600;
  color: var(--text);
}

.deriv-value.disconnected {
  color: var(--bad);
}

.deriv-value.connected {
  color: var(--good);
}

.signin-btn {
  padding: 12px 24px;
  background: linear-gradient(135deg, var(--accent), #0bbf56);
  border: none;
  border-radius: 8px;
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s ease;
  margin-top: 16px;
}

.signin-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
}

.signin-btn:active {
  transform: translateY(0);
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>Mickey Smart AI</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">💰 Deriv Account</div>
      <div class="sidebar-item">
        <span class="sidebar-label">Status:</span>
        <span class="sidebar-value" id="derivConnectionStatus">Disconnected</span>
      </div>
      <div class="sidebar-item">
        <span class="sidebar-label">Account ID:</span>
        <span class="sidebar-value" id="derivAccountId">-</span>
      </div>
      <div class="sidebar-item">
        <span class="sidebar-label">Balance:</span>
        <span class="sidebar-value" id="derivAccountBalance">-</span>
      </div>
    </div>
  </aside>

  <main>
    <div class="card">
      <h2>🎯 Welcome to Mickey Smart AI</h2>
      <p>Connect your Deriv account to start trading and manage your portfolio.</p>
      <button class="signin-btn" onclick="window.location.href='/app/deriv-login.html'">
        🚀 Sign In with Deriv
      </button>
    </div>

    <div class="deriv-section">
      <div class="deriv-head">
        <div class="deriv-icon">💰</div>
        <div class="deriv-title">Account Dashboard</div>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Status:</span>
        <span id="derivConnectionStatus2" class="deriv-value disconnected">Disconnected</span>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Account ID:</span>
        <span id="derivAccountId2" class="deriv-value">-</span>
      </div>
      <div class="deriv-item">
        <span class="deriv-label">Balance:</span>
        <span id="derivAccountBalance2" class="deriv-value">-</span>
      </div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const savedAccount = sessionStorage.getItem('deriv_selected_account');

  if (!savedAccount) {
    console.warn('⚠️ No selected account found');
    return;
  }

  try {
    const account = JSON.parse(savedAccount);
    console.log('✅ Account loaded:', account);

    const isDemo = account.account_type === 'demo';
    const statusText = isDemo ? '✓ Connected (Demo)' : '✓ Connected (Live)';
    const statusClass = isDemo ? 'connected' : 'connected';
    const balance = account.balance !== undefined ? parseFloat(account.balance).toFixed(2) : '0.00';

    document.getElementById('derivConnectionStatus').textContent = statusText;
    document.getElementById('derivConnectionStatus2').textContent = statusText;
    document.getElementById('derivConnectionStatus2').className = `deriv-value ${statusClass}`;

    document.getElementById('derivAccountId').textContent = account.account_id || account.loginid || '-';
    document.getElementById('derivAccountId2').textContent = account.account_id || account.loginid || '-';

    document.getElementById('derivAccountBalance').textContent = `${account.currency || 'USD'} ${balance}`;
    document.getElementById('derivAccountBalance2').textContent = `${account.currency || 'USD'} ${balance}`;
  } catch (error) {
    console.error('❌ Error parsing account data:', error);
  }
});
</script>
</body>
</html>
